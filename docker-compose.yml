services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: telebill
      POSTGRES_PASSWORD: telebill_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
volumes:
  pgdata:
